[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nist-cryptographic-standards-suite"
version = "1.0.0"
description = "Educational implementation of NIST and FIPS cryptographic standards in Python."
readme = "README.md"
authors = [{ name = "Tahniat Farhan", email = "tahniatfarhan@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43.0.0",
    "pycryptodome>=3.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0"
]

[project.scripts]
nist-crypto = "nist_crypto.cli:main"
